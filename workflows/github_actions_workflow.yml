# =============================================================
# WORKFLOW DE GITHUB ACTIONS - Monitor CSJN DAJUDECO
# =============================================================
# Este archivo va en: .github/workflows/monitor_csjn.yml
# dentro de tu repositorio de GitHub.
#
# Ejecuta el script Python cada 4 horas y guarda el registro
# de resoluciones vistas como artefacto del repositorio.
# =============================================================

name: Monitor CSJN - DAJUDECO

on:
  # Ejecutar cada 4 horas
  schedule:
    - cron: '0 */4 * * *'

  # Permitir ejecucion manual desde GitHub (boton "Run workflow")
  workflow_dispatch:

jobs:
  verificar-resoluciones:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el codigo del repositorio
      - name: Checkout repositorio
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instalar dependencias
      - name: Instalar requests
        run: pip install requests

      # 4. Restaurar registro de resoluciones vistas (si existe)
      - name: Restaurar registro previo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      # 5. Ejecutar el monitor
      - name: Ejecutar monitor CSJN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_csjn_dajudeco.py --once

      # 6. Guardar el registro actualizado en el repositorio
      - name: Guardar registro de resoluciones vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_resoluciones.json || true
          git add monitor_csjn.log || true
          git diff --staged --quiet || git commit -m "Actualizar registro de resoluciones vistas"
          git push || true
