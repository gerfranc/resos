name: Bot CSJN - Telegram

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 min: sondea comandos /start, /stop, /ayuda del bot
  workflow_dispatch:          # disparo manual inmediato

# No cancelar una corrida a medias: podria dejar el offset sin commitear y
# reprocesar comandos (respuesta duplicada). Las corridas se serializan.
concurrency:
  group: buscar-telegram
  cancel-in-progress: false

jobs:
  poll-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests playwright pdfplumber
          playwright install chromium
          playwright install-deps chromium

      - name: Sincronizar repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      - name: Poll de comandos Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_csjn_dajudeco.py --telegram-poll

      - name: Persistir estado de Telegram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_state.json || true
          git add telegram_subscribers.json || true
          git add monitor_csjn.log || true
          git diff --staged --quiet || git commit -m "Actualizar offset Telegram"
          git pull origin main --rebase || true
          git push || true
