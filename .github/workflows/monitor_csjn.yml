name: Monitor CSJN - DAJUDECO

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  verificar-resoluciones:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar requests
        run: pip install requests

      - name: Restaurar registro previo
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      - name: Ejecutar monitor CSJN
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_csjn_dajudeco.py --once

      - name: Guardar registro de resoluciones vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_resoluciones.json || true
          git add monitor_csjn.log || true
          git diff --staged --quiet || git commit -m "Actualizar registro de resoluciones vistas"
          git push || true
